AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Quick Drop - web page on CloudFront + S3, and a Lambda (Function URL) that hands out expiring links.

# The full cloud deployment. The first three blocks are the same thing you build by hand
# in the console walkthrough (output.md), in the same order:
#   console Step 1-3 -> UploadBucket      (private, CORS, delete after 1 day)
#   console Step 4-6 -> PresignFunction   (code, handler, env vars, timeout)
#   console Step 7   -> the Policies block (least-privilege access to the bucket)
#   console Step 8   -> FunctionUrlConfig (public URL + CORS)
# The Site* resources are extra: they host the web page itself, so nothing runs on a laptop.

Parameters:
  LocalOrigin:
    Type: String
    Default: http://localhost:8000
    Description: >-
      Also allow the web page when it runs on your laptop (scripts/serve.py), so the same
      deployed backend works for local development. The CloudFront site is always allowed.
  ExpiresIn:
    Type: Number
    Default: 3600
    MinValue: 1
    MaxValue: 3600
    Description: Seconds a share link stays valid (3600 = 1 hour).
  MaxBytes:
    Type: Number
    Default: 104857600
    Description: Largest allowed upload in bytes (default 100 MB).

Resources:
  # ---------------------------------------------------------------- uploads
  # No BucketName on purpose: CloudFormation picks a unique one, so this never
  # collides with the bucket you made by hand in the console.
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub "https://${SiteDistribution.DomainName}"
              - !Ref LocalOrigin
            AllowedMethods: [GET, PUT, POST]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: delete-after-1-day
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadBucket
          EXPIRES_IN: !Ref ExpiresIn
          MAX_BYTES: !Ref MaxBytes
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub "${UploadBucket.Arn}/*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Sub "https://${SiteDistribution.DomainName}"
            - !Ref LocalOrigin
          AllowMethods: [POST]
          AllowHeaders: [content-type]
          MaxAge: 3000

  # ---------------------------------------------------------------- web page
  # A second, private bucket holds the page. Only CloudFront may read it (via the
  # access control below), so the bucket never has to be made public.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} web page"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed "CachingDisabled" policy. Fine for a demo: a redeploy shows up
          # immediately, with no cache invalidation to run.
          # ID from https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  SiteUrl:
    Description: Open this to use the app
    Value: !Sub "https://${SiteDistribution.DomainName}"
  FunctionUrl:
    Description: The backend (scripts/deploy.sh writes this into the deployed page's config.js)
    Value: !GetAtt PresignFunctionUrl.FunctionUrl
  UploadBucketName:
    Description: Where uploaded files are stored
    Value: !Ref UploadBucket
  SiteBucketName:
    Description: Where the web page files are stored
    Value: !Ref SiteBucket
